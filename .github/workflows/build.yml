name: Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    name: Server Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image (same Dockerfile Fly.io uses)
        run: docker build -t haleys-pancreas .
      - name: Start it and check it responds and can save data
        run: |
          SECRET=$(openssl rand -hex 32)
          docker volume create hp_data
          # Fake Dexcom login: the server should stay up, report the sign-in error, and keep serving the app.
          docker run -d --name hp -p 8080:8080 -v hp_data:/data \
            -e APP_SECRET="$SECRET" -e DEXCOM_USERNAME=ci-check -e DEXCOM_PASSWORD=ci-check \
            haleys-pancreas
          for i in $(seq 1 30); do curl -fsS localhost:8080/health/live && break; sleep 1; done
          echo; curl -fsS -H "Authorization: Bearer $SECRET" localhost:8080/status | head -c 300; echo
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/status)" = 401
          # The volume is owned by root, like a Fly volume: the server must be able to write to it.
          for i in $(seq 1 15); do docker exec hp test -f /data/state.json && break; sleep 1; done
          docker exec hp ls -la /data/state.json
      - name: Server logs
        if: always()
        run: docker logs hp || true

  ios:
    name: iOS app (unsigned IPA)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check toolchain
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::error::This app needs the iOS 26 SDK or newer (Liquid Glass). Found $SDK."
            exit 1
          fi

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned archive)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project HaleysPancreas.xcodeproj \
            -scheme HaleysPancreas \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HaleysPancreas.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning:|\*\* (ARCHIVE|BUILD) (SUCCEEDED|FAILED)" || true
          # Fail the step if the archive was not produced, and list every compile error.
          if [ ! -d "$RUNNER_TEMP/HaleysPancreas.xcarchive/Products/Applications" ]; then
            echo "---- compile errors ----"
            grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | sort -u
            exit 1
          fi

      - name: Package IPA
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/HaleysPancreas.xcarchive/Products/Applications/*.app | head -1)
          test -d "$APP/PlugIns/GlucoseWidgets.appex" || { echo "::error::Live Activity extension missing"; exit 1; }
          plutil -p "$APP/Info.plist" | grep -E "CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion|NSSupportsLiveActivities"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/HaleysPancreas-unsigned.ipa" Payload)
          ls -la "$GITHUB_WORKSPACE/HaleysPancreas-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HaleysPancreas-unsigned-ipa
          path: HaleysPancreas-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore
