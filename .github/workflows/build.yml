name: Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  ios:
    name: iOS app (unsigned IPA)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check toolchain
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::error::This app needs the iOS 26 SDK or newer (Liquid Glass). Found $SDK."
            exit 1
          fi

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned archive)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project HaleysPancreas.xcodeproj \
            -scheme HaleysPancreas \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HaleysPancreas.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning:|\*\* (ARCHIVE|BUILD) (SUCCEEDED|FAILED)" || true
          # Fail the step if the archive was not produced, and list every compile error.
          if [ ! -d "$RUNNER_TEMP/HaleysPancreas.xcarchive/Products/Applications" ]; then
            echo "---- compile errors ----"
            grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | sort -u
            exit 1
          fi

      - name: Package IPA
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/HaleysPancreas.xcarchive/Products/Applications/*.app | head -1)
          test -d "$APP/PlugIns/GlucoseWidgets.appex" || { echo "::error::Live Activity extension missing"; exit 1; }
          plutil -p "$APP/Info.plist" | grep -E "CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion|NSSupportsLiveActivities"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/HaleysPancreas-unsigned.ipa" Payload)
          ls -la "$GITHUB_WORKSPACE/HaleysPancreas-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HaleysPancreas-unsigned-ipa
          path: HaleysPancreas-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore
